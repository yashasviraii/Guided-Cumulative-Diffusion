[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcd"
version = "0.1.0"
description = "Guided Cumulative Diffusion: graph-guided entity prioritization and log-bias attention modulation for compositional text-to-image synthesis"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
